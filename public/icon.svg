  <g fill="#B8F25C">
    <rect x="136" y="240" width="240" height="32" rx="8"/>
    <rect x="156" y="176" width="40" height="160" rx="12"/>
    <rect x="316" y="176" width="40" height="160" rx="12"/>
    <rect x="116" y="204" width="32" height="104" rx="10"/>
    <rect x="364" y="204" width="32" height="104" rx="10"/>
  </g>
</svg>
