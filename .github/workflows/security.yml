name: Security Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0' # Weekly scan

permissions:
  contents: read

jobs:
  trivy-scan:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    name: Trivy Dependency Scan
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload to GitHub Security
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@5d4e8d1aca955e8d8589aabd499c5cae939e33c7 # v4.31.9
        with:
          sarif_file: 'trivy-results.sarif'

  secrets-scan:
    runs-on: ubuntu-latest
    name: Secrets Detection
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@d232362a64a09a9e7d58267b8f5acef00ae90e23 # v3.100.0
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && '0000000000000000000000000000000000000000') || '' }}
          head: ${{ github.event_name == 'pull_request' && 'HEAD' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'HEAD') || '' }}
          extra_args: --debug
          version: v3.100.0

  npm-audit:
    runs-on: ubuntu-latest
    name: NPM Security Audit
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --strict-allow-scripts

      - name: Run npm audit (non-blocking)
        id: npm-audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run npm audit fix dry-run (non-blocking)
        id: npm-audit-fix
        run: npm audit fix --dry-run
        continue-on-error: true

      - name: Summarize npm audit results
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.npm-audit.outcome }}
          AUDIT_FIX_OUTCOME: ${{ steps.npm-audit-fix.outcome }}
        run: |
          echo '### npm audit (non-blocking)' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if [ "$AUDIT_OUTCOME" = "success" ]; then
            echo 'Audit passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Audit did not complete successfully (outcome: ${AUDIT_OUTCOME:-unknown}); inspect the audit step log for vulnerability findings or execution errors." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$AUDIT_FIX_OUTCOME" = "failure" ]; then
            echo 'The remediation dry-run did not pass; inspect its step log for details.' >> "$GITHUB_STEP_SUMMARY"
          fi
