# What is scanned, what blocks and how risks are accepted: docs/adr/0016-analisis-de-seguridad-en-ci.md
# Pinned tool versions and their advisory check: docs/adr/0018-versiones-fijadas-de-herramientas-de-ci.md
name: Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0' # Weekly scan

permissions:
  contents: read

# Tools the actions download at runtime. Dependabot only bumps the action SHAs, so these are
# updated by hand; the tool-advisories job fails when a pinned version has a known advisory.
env:
  TRIVY_VERSION: 'v0.76.2'
  TRUFFLEHOG_VERSION: '3.100.0'

jobs:
  tool-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Pinned Tool Advisories
    steps:
      - name: Check pinned tool versions against GitHub advisories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          for pkg in "github.com/aquasecurity/trivy@${TRIVY_VERSION#v}" \
                     "github.com/trufflesecurity/trufflehog/v3@${TRUFFLEHOG_VERSION}"; do
            hits=$(gh api "/advisories?ecosystem=go&affects=${pkg}&per_page=100" \
              --jq '.[] | "\(.ghsa_id) \(.severity) \(.summary)"')
            if [ -n "$hits" ]; then
              echo "::error::${pkg} has known advisories"
              echo "$hits"
              status=1
            else
              echo "${pkg}: no known advisories"
            fi
          done
          exit "$status"

  trivy-scan:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Trivy Dependency Scan
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Two passes over the same cached DB: a full report for the Security tab that never fails,
      # then a gate that fails the job. Accepted findings live in .trivyignore (reason + expiry)
      # and are left out of both.
      - name: Trivy report (all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          # Secrets are TruffleHog's job.
          scanners: 'vuln'
          trivyignores: '.trivyignore'
          # The action defaults to an older Trivy; the gate below reuses this binary.
          version: ${{ env.TRIVY_VERSION }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload to GitHub Security
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: 'trivy-results.sarif'

      # Fails on new MEDIUM+ findings, like the old `npm audit --audit-level=moderate`.
      - name: Trivy gate (MEDIUM+)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          trivyignores: '.trivyignore'
          severity: 'MEDIUM,HIGH,CRITICAL'
          exit-code: '1'
          format: 'table'
          skip-setup-trivy: true

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Secrets Detection
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # v3.100.1
        # No base/head: the action picks the range per event (PR: base..head, push:
        # before..after, schedule: full history).
        with:
          path: ./
          # Docker image tag the action runs; it defaults to "latest", so it stays pinned in env.
          # Dependabot bumps only the SHA above: update TRUFFLEHOG_VERSION to the same release in that PR.
          version: ${{ env.TRUFFLEHOG_VERSION }}
