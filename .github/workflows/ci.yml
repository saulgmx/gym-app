name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job name "ci" is the required status check for main (ADR-0011, T23).
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Chromium, WebKit and their system deps come preinstalled, so E2E downloads nothing from the
    # Ubuntu mirror (it sometimes trickled at ~60 kB/s and timed out). The tag must match
    # @playwright/test in package.json: update both together, and the digest with them.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-resolute@sha256:dcf385f7a31aa1cbb0a7a0c97a539142bf70480b661f89f26a774ec1fe2edd1d
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions # the same file mise reads locally
          cache: npm

      # Unreviewed install scripts fail the install instead of only warning.
      - run: npm ci --strict-allow-scripts

      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Initial JS < 200 kB gzip (QS-10, AC-34); measures dist/, so it runs after the build.
      - run: npm run size

      # E2E on vite preview with the production headers (AC-1, AC-23, AC-26, AC-36). The
      # browsers come from the container image above.
      - run: npm run test:e2e
