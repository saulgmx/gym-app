name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job name "ci" is the required status check for main (ADR-0011, T23).
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json # reads volta.node
          cache: npm

      # Unreviewed install scripts fail the install instead of only warning.
      - run: npm ci --strict-allow-scripts

      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Initial JS < 200 kB gzip (QS-10, AC-34); measures dist/, so it runs after the build.
      - run: npm run size
