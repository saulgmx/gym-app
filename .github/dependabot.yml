version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current. npm stays manual: exact
  # versions and an allowScripts review on every install.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Skip releases younger than a week, so a compromised tag has time to be caught upstream.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
